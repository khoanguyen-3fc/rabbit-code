<!-- Rabbit Code icon.

     Carrot: traced in Inkscape for this repo, then cleaned up here. The trace arrived with the
     body split into 10 subpaths, 9 of which were sub-pixel specks scattered across the leaf area;
     dropping them is most of why the body path is 841 characters instead of 2342. All coordinates
     are rounded to two decimals.

     Leaves are drawn BEFORE the body, and their base carries a flap running 24 units down the
     carrot axis so the body paints over the junction. That is what closes the gap that showed
     between leaf and body: there is no edge to align, the seam is buried.

     Three stripes run perpendicular to the axis, alternating which side they enter from, each
     bleeding through its own edge and stopping 55% across. Clipped to the body and round-capped,
     so the end pointing into the body reads as a rounded tip while the outer cap falls outside
     the clip and is never seen.

     Placement: rotated to 20 degrees off vertical (the trace was drawn at 45). Centred
     horizontally on the artwork's area centroid, because the orange mass sits off-centre inside
     its bounding box and box-centring left the carrot visibly right of the midline. Vertically it
     is fitted to the braces instead: top and bottom land on 12.25 and 51.69, the measured outer
     edges of the brace strokes, to within 0.06.

     Braces: exact mirrors of one path about x=32, stroke 3.4, nub at x=6.44. -->
